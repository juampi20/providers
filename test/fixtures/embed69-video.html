    function go_to_player(url) {
        var displayVideo = document.getElementById("displayVideo");
        var firstLoad = document.getElementById("firstLoad");
        firstLoad.classList.add("FirstLoadA");
        displayVideo.classList.add("DisplayVideoA");
        displayVideo.innerHTML =

        var wpw = document.querySelector(".wpw");
        var selLang = document.querySelector(".SelectLangDisp");
        var opts = document.querySelector(".OptionsLangDisp");
        if (wpw) wpw.style.display = "none";
        if (selLang) selLang.style.display = "none";
        if (opts) opts.style.display = "none";
        // Quitar el loading cuando el iframe del embed haya cargado realmente
        var iframe = displayVideo.querySelector("iframe");
        if (iframe) {
            iframe.addEventListener("load", function() {
                firstLoad.classList.remove("FirstLoadA");
            });
        }
        // Soporte para embeds propios que envíen postMessage EMBED_LOADED
        window.addEventListener('message', function handler(ev) {
            if (ev.data && ev.data === 'EMBED_LOADED') {
                firstLoad.classList.remove("FirstLoadA");
                window.removeEventListener('message', handler);
            }
        });
        // Timeout de seguridad (solo si el iframe no dispara 'load' p. ej. bloqueado)
        setTimeout(function() { firstLoad.classList.remove("FirstLoadA"); }, 10000);
    }

    function listPlayer() {
        var displayVideo = document.getElementById("displayVideo");

        var wpw = document.querySelector(".wpw");
        var selLang = document.querySelector(".SelectLangDisp");
        var opts = document.querySelector(".OptionsLangDisp");
        if (wpw) wpw.style.display = "";
        if (selLang) selLang.style.display = "";
        if (opts) opts.style.display = "";
    }

        if (typeof CookieHandler === 'undefined' || typeof VASTVideoPlayer === 'undefined') {
            go_to_player(urlGlobal);
            return;
        }

        if (CookieHandler.checkVisitAdsCompleted()) {
            go_to_player(urlGlobal);
            return;
        }

        var vastQueue = [];
        if (VAST_URL_1) vastQueue.push(VAST_URL_1);
        if (VAST_URL_2) vastQueue.push(VAST_URL_2);

        if (vastQueue.length === 0) {
            go_to_player(urlGlobal);
            return;
        }

        var totalAds = vastQueue.length;

        function playNext(index) {
            if (index >= vastQueue.length) {
                // Todos los VAST completados
                hideAdIndicator();
                var userValueCookie = CookieHandler.getCookie("adsCompleted");
                var newValue = +userValueCookie + 1;
                CookieHandler.createCookie("adsCompleted", newValue.toString(), 1);
                go_to_player(urlGlobal);
                return;
            }

            updateAdIndicator(index + 1, totalAds);

            // Resetear estado del player entre reproducciones
            var videoPlayer = document.getElementById("videoPlayer");
            var skipBtn = document.getElementById("skipCountdown");
            var goToAdLnk = document.getElementById("goToLink");
            if (videoPlayer) {
                videoPlayer.removeAttribute('src');
                videoPlayer.load();
            }
            if (skipBtn) {
                skipBtn.style.display = 'none';
                skipBtn.onclick = null;
            }
            if (goToAdLnk) {
                goToAdLnk.style.display = 'none';
                goToAdLnk.href = '#';
            }
            if (videoPlayer) videoPlayer.onclick = null;

            var player = new VASTVideoPlayer(vastQueue[index]);
            player.onCompletedCallback = function() {
                playNext(index + 1);
            };

            // Esperar a que esté listo y ejecutar
            var checkReady = setInterval(function() {
                if (player.ready || player.error) {
                    clearInterval(checkReady);
                    player.runAds();
                }
            }, 100);

            // Timeout de seguridad: 8 segundos
            setTimeout(function() {
                if (!player.ready && !player.error) {
                    clearInterval(checkReady);
                    player.error = true;
                    player.runAds();
                }
            }, 8000);
        }

        playNext(0);
    }
